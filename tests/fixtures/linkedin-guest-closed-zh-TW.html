<!-- Trimmed capture of the guest posting endpoint for a LinkedIn posting that
     has closed, as served to a zh-TW locale visitor. Structure mirrors the
     English fixture; only the closed-marker text is localized. Company, title
     and location are synthetic. -->
<section class="core-rail">
  <div class="top-card-layout">
    <h1 class="top-card-layout__title">資深軟體工程師</h1>
    <h4 class="top-card-layout__second-subline">
      <span class="topcard__flavor">範例科技股份有限公司</span>
      <span class="topcard__flavor topcard__flavor--bullet">台北市, 台灣</span>
      <figure class="closed-job closed-job__flavor topcard__flavor-row">
        <span class="closed-job__icon closed-job__icon--error-pebble lazy-load"></span>
        <figcaption class="closed-job__flavor--closed">不再接受申請</figcaption>
      </figure>
    </h4>
  </div>
  <div class="description__text">
    <p>範例科技徵求資深軟體工程師，負責平台服務開發。</p>
  </div>
</section>
